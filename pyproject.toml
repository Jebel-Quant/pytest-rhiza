[project]
license = "MIT"
license-files = ["LICENSE"]
name = "pytest-rhiza"
version = "0.3.0"
description = "The rhiza repository checks, as a pytest plugin instead of a synced test folder"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jebel Quant Research" }]
keywords = ["pytest", "rhiza", "template", "repository-checks"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Deliberately three small runtime dependencies and no more, which is the argument for a
# dedicated distribution: folding the checks into `rhiza` would drag jinja2, typer and rich
# into every test environment, and into `rhiza-tools` would add pandas and plotly.
#
# It was four until #53. python-dotenv bought exactly one lookup — `SOURCE_FOLDER` out of a
# `.rhiza/.env`, on a rung kept only for repos still on rhiza v1.3 — and
# `checks/test_docstrings._read_rhiza_env` now does that with the stdlib. A dependency in
# every rhiza-managed repo's test environment is a steep price for a legacy key, and this
# package is installed in all of them.
#
# The pytest floor is 8.1, not 8.0, and the reason is specific to how this package is
# consumed. `--pyargs` is the whole interface: the checks live in site-packages and are
# named on the command line, so the repository under test and the installed modules sit
# in two unrelated directory trees. Up to and including 8.0.2, pytest walked the *generic*
# ancestor chain of a `--pyargs` argument and fully scanned the first directory outside
# confcutdir — on a GitHub ubuntu runner that is `/home`, whose `packer` entry the
# `runner` user cannot stat, so collection died with a PermissionError and zero tests
# (#23). 8.1.0 added a `--pyargs` branch that stops at the package hierarchy:
#
#     # For --pyargs arguments, only consider paths matching the module
#     # name. Paths beyond the package hierarchy are not included.
#
# Bisected: 8.0.0, 8.0.1 and 8.0.2 fail, 8.1.0 onwards pass. In practice `>=8.1`
# resolves to 8.1.1, 8.1.0 having been yanked from PyPI.
dependencies = [
    "pytest>=8.1",
    "pytest-timeout>=2.3",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/jebel-quant/pytest-rhiza"
Repository = "https://github.com/jebel-quant/pytest-rhiza"
Issues = "https://github.com/jebel-quant/pytest-rhiza/issues"

# What replaces the synced conftest.py: the fixtures arrive by entry point, so a
# consumer repo needs no conftest of its own and no `pythonpath` entry to find one.
[project.entry-points.pytest11]
rhiza = "pytest_rhiza.plugin"

[dependency-groups]
test = ["pytest>=8.1", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_rhiza"]

# deptry compares *declared* dependencies against *imported* ones, which mis-reads one of
# the three runtime deps — not because the dependency is unused, but because it is never
# imported at all.
#
# A `[tool.deptry.package_module_name_map]` table used to sit here as well, mapping the
# `python-dotenv` distribution to the `dotenv` module it installs. #53 dropped that
# dependency and the table went with it: it had exactly one entry, and none of the three
# remaining distributions installs a module under a different name.
[tool.deptry.per_rule_ignores]
# pytest-timeout is consumed through its own pytest11 entry point and is never imported, so
# deptry cannot see the use at all. It is declared anyway, and has to be: a consumer
# installing this package must get the plugin the checks run under, since the bound on a
# hanging check comes from it.
DEP002 = ["pytest-timeout"]

# bump-my-version reads [project].version natively; /rhiza:release owns the commit and
# the tag. Asserted by this package's own checks/test_pyproject.py, run against itself.
[tool.bumpversion]
allow_dirty = false
commit = false
tag = false

# One [[files]] entry per *additional* place the version is written — never for
# [project].version itself, which is read natively. `pytest_rhiza.__version__` is the
# only other place, and it sat three releases stale because this entry was described in
# a comment but never written (#12). tests/test_version.py asserts both halves: that the
# two numbers agree, and that this entry still exists to keep them agreeing.
[[tool.bumpversion.files]]
filename = "src/pytest_rhiza/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

# Source modules in src/pytest_rhiza/checks/ are deliberately named test_*.py because
# they are pytest check modules collected out of site-packages via `--pyargs`. Mirroring
# them with tests/pytest_rhiza/checks/test_test_*.py would produce nonsensical file names
# and break the published interface. Tests are instead organised by behaviour in the
# top-level tests/ directory (test_checks.py, test_fences.py, test_plugin.py).
[tool.check_test_layout]
enforce = false
reason = "Source modules are deliberately named test_*.py — they are pytest check modules collected via --pyargs from site-packages. Mirroring them would require test_test_*.py filenames and break the published interface. Tests are organised by behaviour (test_checks.py, test_fences.py, test_plugin.py) instead."

# Without this the coverage number for this package is meaningless. The checks are
# *tests*: they are exercised by naming them on an inner `pytest --pyargs` command line
# in a subprocess, never by importing them, so a coverage run that only watches the
# parent process sees `src/pytest_rhiza/checks/` at 0% however thoroughly it is tested.
# `patch = ["subprocess"]` makes coverage inject its own start-up into every child the
# suite spawns, which is where the checks actually execute.
[tool.coverage.run]
patch = ["subprocess"]
