# git-cliff ~ https://git-cliff.org/docs/configuration
#
# CHANGELOG.md was generated by git-cliff from the start, but the config never was
# committed — so the file's format depended on whichever default the next contributor's
# git-cliff happened to ship, and regenerating it was not reproducible. That is what this
# file fixes (#57).
#
# It is deliberately the upstream default, trimmed of commented-out examples, with the
# changes noted below. Keeping the rest identical matters: the entries already in
# CHANGELOG.md were produced by the default, so a config that grouped commits differently
# would make a regenerated file disagree with its own history. Each change below is
# therefore checked against what is already in the file, not just against taste.
#
# **This config governs new sections, and does not claim to reproduce the old ones.** The
# released sections were hand-pruned before any config was committed, so a full
# `uvx git-cliff` run does not come out byte-identical to them — 0.2.0 gains a
# `Delete .rhiza directory` line that was edited out at the time. Regenerate the unreleased
# section and prepend it; do not rewrite a released one, which is history.

[changelog]
# Rendered once, above every release section. It exists to settle how a reader should treat
# an old entry, which #57 raised: `## [0.2.2]` says "Add Makefile, pre-commit hooks and a
# CI lint job", and #52 later deleted that Makefile. Editing the 0.2.2 line would be the
# wrong fix — 0.2.2 did add it — so the file states the convention instead. Being part of
# the template rather than hand-written text above it is what keeps this from drifting.
header = """# Changelog

Each entry records what one release *did*. Entries are not edited afterwards, so where a
later release removes something an earlier one added, both lines stand — read the file
downwards, not as a description of the current tree.

Generated by [git-cliff](https://git-cliff.org) from the commit log; `cliff.toml` holds the
grouping rules.

"""

# The rendered shape of one release. Kept verbatim from the default so the headings match
# the entries already in the file: `## [X.Y.Z] - DATE`, then emoji group sections.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true

# CHANGE 1 — the default is `true`, which drops any commit whose subject is not
# conventional *without saying so*. That is the #34 failure mode in a changelog: the
# `[tool.check_test_layout]` opt-out (cc5aa39, "Add check_test_layout opt-out to
# pyproject.toml") was a substantive change and left no trace. Unconventional commits now
# fall through to the catch-all group instead, and the only ones that vanish are the ones
# a rule below skips by name.
filter_unconventional = false

require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false

# Assigns commits to groups, in order — first match wins. The numeric HTML comments only
# order the sections; `striptags` removes them before rendering.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    # `/rhiza:release` commits the bump as `chore: release vX.Y.Z`. Without this skip the
    # generic `^chore` rule below files that commit as a changelog entry, so every release
    # would list "Release vX.Y.Z" under Miscellaneous Tasks — an entry about the release
    # rather than about anything the release did. It only bites when the changelog is
    # regenerated after the bump commit exists, which is why it went unnoticed: the flow
    # normally generates the changelog first and commits both together.
    { message = "^chore: release", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 9 -->◀️ Revert" },

    # CHANGE 2 — the consequence of turning the unconventional filter off: what the
    # filter used to drop wholesale now has to be named. Both of these are real, and
    # naming them is the difference between this and the filter that dropped cc5aa39
    # silently.
    #
    # A merge commit restates the subject of the branch it merges, so keeping them would
    # print every entry twice — once from the commit and once from its merge.
    { message = "^Merge (pull request|branch|remote-tracking)", skip = true },
    # The scaffolding an agent-assisted PR leaves behind; no subject worth a line.
    { message = "^Initial plan$", skip = true },
    # Release commits record that a version was cut, which the heading above them already
    # says. `[tool.bumpversion]` sets `commit = false`, so these come from the release flow.
    { message = "^Release v", skip = true },

    # Everything else, including `build:` — which the default does not map either, and
    # which is why 0.2.2's Makefile line sits under this heading.
    { message = ".*", group = "<!-- 10 -->💼 Other" },
]

# CHANGE 3 — the default carries `{ body = ".*security", group = "🛡️ Security" }`, a
# substring match on the commit *body*. It mis-filed `build: give typecheck, docs-coverage
# and security local entry points` (391ed72) under Security, which is a build change that
# happens to name the security gate. Dropping it contradicts nothing already in the file:
# no release in CHANGELOG.md has ever rendered a Security section. A real security fix
# should say so in its subject and be grouped by its `fix:`/`feat:` prefix like everything
# else, rather than by whether the word appears somewhere in the body.
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
