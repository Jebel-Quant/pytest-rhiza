name: CI

# Third-party actions are SHA-pinned, with the human-readable version in the trailing
# comment. A tag is a mutable ref — even an exact one like `v10.0.1` — so pinning to it
# leaves the code that runs in CI changeable by its owner with no commit here. The SHA is
# the only immutable form; the trailing comment is what keeps it reviewable, and
# .github/dependabot.yml is what keeps the two moving together. Pinning without an
# updater only trades a mutable ref for a stale one, so the two arrive together.
#
# Separately, `astral-sh/setup-uv` could not have used a floating major in any case: it
# publishes no `v8`, `v9` or `v10` alias tag, so `@v10` does not resolve at all.
#
# `.github/workflows/rhiza_*.yml` are upstream files from jebel-quant/rhiza, so pinning
# them belongs upstream and is filed as Jebel-Quant/rhiza#1577 rather than patched here.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the suite only needs to read the code.
permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek (pre-commit hooks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # prek is the Rust drop-in for pre-commit and reads .pre-commit-config.yaml
      # unchanged. `uvx` fetches it, so there is no separate install step — the same
      # command `make lint` runs locally.
      #
      # The ruff hooks rewrite files with `--fix` and `ruff format`; --show-diff-on-failure
      # prints what they would have changed, so a red run says which edit to make.
      - name: Run hooks
        run: uvx prek run --all-files --show-diff-on-failure

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Mirrors the Programming Language :: Python :: X.Y classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # `uv run` builds and installs pytest-rhiza itself, which is what registers the
      # pytest11 entry point. The suite drives pytest inside pytest via `pytester`, so
      # the plugin has to be installed for those inner runs to load it at all.
      #
      # The suite shells out to git (the `latest_tag` fixture, and the throwaway repos
      # the tests build), and it is `git` on PATH that is used — `shutil.which` resolves
      # it, so the Windows runner's git works the same as the others.
      #
      # The coverage flags mirror `make test` and `rhiza-task test`, so the threshold is
      # the same number in all three places. Measuring it at all depends on
      # `[tool.coverage.run] patch = ["subprocess"]` in pyproject.toml: the checks are
      # exercised by inner `pytest --pyargs` runs in subprocesses, which a parent-only
      # coverage run does not see.
      - name: Run tests
        run: >-
          uv run --group test --python ${{ matrix.python-version }}
          pytest -ra --cov=src --cov-report=term-missing --cov-fail-under=90

  audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The `security` gate rhiza_ci.yml runs is bandit only — it scans *our* source for
      # insecure patterns and never looks at what we depend on. This is the other half:
      # pip-audit resolves the locked environment and checks it against the advisory
      # database. It matters more here than in most projects, because pytest-rhiza is a
      # runtime dependency of every rhiza-managed repo, so a vulnerable transitive
      # dependency propagates into every consumer's test environment.
      - name: Audit dependencies
        run: uvx pip-audit
