name: CI

# Third-party actions are SHA-pinned, with the human-readable version in the trailing
# comment. A tag is a mutable ref — even an exact one like `v10.0.1` — so pinning to it
# leaves the code that runs in CI changeable by its owner with no commit here. The SHA is
# the only immutable form; the trailing comment is what keeps it reviewable, and
# .github/dependabot.yml is what keeps the two moving together. Pinning without an
# updater only trades a mutable ref for a stale one, so the two arrive together.
#
# Separately, `astral-sh/setup-uv` could not have used a floating major in any case: it
# publishes no `v8`, `v9` or `v10` alias tag, so `@v10` does not resolve at all.
#
# THIS FILE IS THE DEFINITION OF THE GATE COMMAND LINES.
#
# It was their only home until #58, which added a copy to README.md under "Running one by
# hand" — because reproducing a red job otherwise meant opening this file and reading YAML,
# a cost paid by every contributor including the ones who never write CI. This file is still
# the definition; the README is a copy, and `tests/test_readme_gates.py` is what keeps it
# one. That test compares the two token for token in both directions, so a flag added or a
# threshold changed here fails the suite until the README is updated to match (#63). CI-only
# scaffolding — the matrix's `--python`, the skip guard around `rhiza-test` — is declared in
# that module's allowlist rather than silently tolerated.
#
# Until #52 they were owned by the reusable workflow `jebel-quant/rhiza`'s rhiza_ci.yml,
# and this repo mirrored a subset into a Makefile so a contributor could reproduce a red
# job. Both layers are gone. The reason is the dependency direction: jebel-quant/rhiza
# pins pytest-rhiza as a dependency (its pyproject.toml carries
# `pytest-rhiza @ git+…@v0.2.1`), so this repository calling rhiza's reusable CI closed a
# cycle — rhiza's workflow ran the gates that judged the package rhiza itself depends on.
# Every other consumer gets a one-way edge; this one got a loop.
#
# So the gates are defined here, in full, and nothing in this file invokes rhiza or
# rhiza-task. The one remaining rhiza_*.yml stub is a deliberate exception, below.
#
# There is still no Makefile and no task runner, and nothing here invokes rhiza-task. What
# changed at #66 is that `scripts/gates.py` gives the gates a local entry point again — and
# it does so without becoming the second home #52 removed, because it holds no recipes: it
# parses the README fence this file is pinned to and runs what is written there. So the
# ordering stands unchanged: this file defines, the README copies, the test pins, the runner
# executes. Reproducing a red gate is `python scripts/gates.py <gate>`; the older paths —
# a paste out of the README (#58), or reading this YAML (#49, #32) — both still work.
#
# `rhiza_codeql.yml` and `rhiza_scorecard.yml` are gone too. They called out to rhiza's
# reusable CodeQL and OSSF Scorecard workflows, which meant a pinned edge to maintain for
# scanning this repository does not depend on: no rhiza_*.yml stub is left that calls a
# reusable workflow parameterised by this package.
#
# `rhiza_release.yml` stays unpinned and unedited: it is synced verbatim because PyPI
# Trusted Publishing validates the exact workflow path, so its `uses:` lines are
# upstream's text, not ours. That half remains Jebel-Quant/rhiza#1577.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job below only reads the code.
permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: prek (pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # prek is the Rust drop-in for pre-commit and reads .pre-commit-config.yaml
      # unchanged, so `uvx prek run --all-files` is also what a contributor runs.
      #
      # The ruff hooks rewrite files with `--fix` and `ruff format`; --show-diff-on-failure
      # prints what they would have changed, so a red run says which edit to make.
      - name: Run hooks
        run: uvx prek run --all-files --show-diff-on-failure

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Mirrors the Programming Language :: Python :: X.Y classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # `uv run` builds and installs pytest-rhiza itself, which is what registers the
      # pytest11 entry point. The suite drives pytest inside pytest via `pytester`, so
      # the plugin has to be installed for those inner runs to load it at all.
      #
      # The suite shells out to git (the `latest_tag` fixture, and the throwaway repos
      # the tests build), and it is `git` on PATH that is used — `shutil.which` resolves
      # it, so the Windows runner's git works the same as the others.
      #
      # The 90 is the threshold, and this line is now its only home. Measuring it at all
      # depends on `[tool.coverage.run] patch = ["subprocess"]` in pyproject.toml: the
      # checks are exercised by inner `pytest --pyargs` runs in subprocesses, which a
      # parent-only coverage run does not see.
      #
      # `scripts` is measured beside `src` since #69. Nothing under it ships in the wheel,
      # which is why it was left out at first — but `scripts/gates.py` is what decides
      # whether every other gate here is green, and it was the one module held to this
      # repo's typing and docstring bars with no coverage floor behind them.
      - name: Run tests
        run: >-
          uv run --group test --python ${{ matrix.python-version }}
          pytest -ra --cov=src --cov=scripts --cov-report=term-missing --cov-fail-under=90

  typecheck:
    name: Type checking (ty + mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `src` and `scripts`, but not `tests/`: the suite leans on pytest fixtures and
      # monkeypatching that a strict checker reads as untyped, and typing it would be
      # noise rather than safety. `scripts/` is ordinary annotated code and is checked
      # like the package — it arrived with the gate runner (#66), and a new source
      # directory outside every gate is how a blind spot becomes permanent.
      #
      # `--with ty` rather than a dependency-group entry so the checker does not enter the
      # runtime resolution of a package every rhiza-managed repo installs.
      - name: Type-check src
        run: uv run --with ty ty check src scripts

      # Two checkers, because they answer different questions and the second one found
      # things the first accepts (#67). `ty` infers and reports what it can prove wrong;
      # `--strict` additionally *demands annotations*, which is a policy `ty` has no
      # opinion on. On adoption it reported 61 errors over 7 files that `ty` passed
      # clean: 40 bare `dict` annotations (i.e. `dict[Any, Any]`, erasing the known-`str`
      # key type of every parsed TOML table), 18 unannotated functions, and two returns
      # of `Any` from functions declaring a concrete type. One of those two was a real
      # disagreement, not a notation gap — `bumpversion_table` handed back a non-table
      # `tool.bumpversion` that `has_bumpversion_section` reported as absent.
      #
      # Keeping both is the point: dropping `ty` loses fast inference on every push,
      # dropping mypy loses the annotation floor that keeps `Any` from spreading back in.
      #
      # No `[tool.mypy]` table, for the same reason interrogate's threshold and the
      # coverage floor are not mirrored into pyproject.toml: one home per setting. The
      # flags are here. And no `--group test` — pytest is a *runtime* dependency of this
      # package, so `uv run` already resolves it and the stubs are present.
      - name: Type-check src strictly
        run: uv run --with mypy mypy --strict src scripts

  docs-coverage:
    name: Docstring coverage (interrogate)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # 100 with no exemptions, over src *and* tests: a test whose name is its only
      # explanation is the kind this suite specifically avoids. --ignore-init-method and
      # --ignore-magic drop the two cases where a docstring would restate the signature.
      #
      # Deliberately not mirrored into `[tool.interrogate]` in pyproject.toml. One home
      # for the number; a committed table would be a second, and two homes for one
      # threshold is how they drift apart.
      - name: Check docstring coverage
        run: >-
          uv run --with interrogate interrogate -vv --fail-under 100
          --ignore-init-method --ignore-magic src tests scripts

  deptry:
    name: Dependency hygiene (deptry)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The one gate whose configuration is *not* on this line: deptry reads
      # `[tool.deptry]` from pyproject.toml, which carries the `python-dotenv` → `dotenv`
      # module map and the DEP002 ignore for the entry-point-only pytest-timeout. Both
      # are mappings for how deptry infers, not suppressions of a real gap.
      #
      # Before #49 this gate ran only inside rhiza's reusable workflow, so its config
      # lived here while nothing in this repository ever invoked it.
      - name: Check declared vs imported dependencies
        run: uvx deptry src

  security:
    name: Security scanning (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # -ll is medium-and-above. The `# nosec` markers in _process.py and conftest.py are
      # narrow and each carries its reason in the line above it: a fixed argument list
      # with no shell is not the injection risk B404/B603 screen for.
      - name: Scan src for insecure patterns
        run: uvx bandit -r src scripts -ll -q

  audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The other half of `security`: bandit scans *our* source for insecure patterns and
      # never looks at what we depend on. pip-audit resolves the locked environment and
      # checks it against the advisory database. It matters more here than in most
      # projects, because pytest-rhiza is a runtime dependency of every rhiza-managed
      # repo, so a vulnerable transitive dependency propagates into every consumer's test
      # environment.
      - name: Audit dependencies
        run: uvx pip-audit

  lowest-deps:
    name: Lowest-direct dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The floors in pyproject.toml are claims, and this is what tests them. `pytest>=8.1`
      # in particular is a *bisected* floor, not a guess — 8.0.x walks the generic ancestor
      # chain of a `--pyargs` argument and dies on an unstat-able /home entry (#23) — so a
      # gate that never resolves 8.1.1 would let that floor rot back to a version the
      # package cannot actually run on.
      - name: Install with lowest-direct resolution
        run: uv sync --all-extras --all-groups --resolution lowest-direct

      - name: Run tests against the floors
        run: uv run --all-extras --all-groups --resolution lowest-direct pytest -ra

  license:
    name: License compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # This repository is MIT and is a runtime dependency of every rhiza-managed repo, so a
      # strong-copyleft package entering its dependency closure would propagate an obligation
      # into every consumer's test environment.
      #
      # NOTE: this policy is *this repository's own*, not a copy of the bar rhiza's reusable
      # workflow used — that ran `rhiza-task license`, whose threshold is not visible from
      # here. Stated rather than inherited, so it is reviewable (#52).
      #
      # `--allow-only`, not `--fail-on`, and the polarity is the whole point. `--fail-on`
      # names the licences to refuse, so it passes whenever a copyleft package spells its
      # licence in a way the list did not anticipate — and the spellings are genuinely
      # inconsistent, because pip-licenses reports package metadata verbatim: this closure
      # alone yields `MIT`, `MIT License`, `Apache-2.0` and `DFSG approved; MIT License`.
      # Matching is per-name rather than substring (`IT` does not match `MIT`), so a deny
      # list written in classifier prose misses the SPDX spelling of the same licence and
      # goes green. That is the #34 failure mode with a licence attached, so the gate is
      # fail-closed instead: an unlisted licence is a red job and a human decision.
      #
      # `Apache-2.0 OR BSD-2-Clause` is listed as one entry because pip-licenses does not
      # split on ` OR ` — it splits on `;`. Every entry below is load-bearing for today's
      # closure except `BSD-3-Clause`, which is held in reserve: it was python-dotenv's, and
      # #53 removed that dependency. It stays because BSD-3 is squarely within the policy, so
      # the first BSD-3 dependency to arrive should not be a red build.
      - name: Print the resolved licence table
        run: uv run --with pip-licenses pip-licenses --format markdown --with-urls

      - name: Allow only permissive licences
        run: >-
          uv run --with pip-licenses pip-licenses --allow-only
          "MIT;MIT License;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache-2.0 OR BSD-2-Clause;DFSG approved"

  rhiza-test:
    name: Rhiza checks, self-applied (with tags)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # This package's own checks, run against this repository. It is a Python project with a
    # README, a pyproject.toml and a release config, so it is a valid subject for its own
    # assertions — and self-application is the only way the checks get exercised against a
    # real repository rather than a fixture.
    #
    # Two things this job does that rhiza's equivalent did not, which is why losing that
    # workflow costs nothing here:
    #
    #   1. `fetch-depth: 0`. rhiza's checkout fetched no tags, so `latest_tag` found none
    #      and the two assertions comparing [project].version against the newest vX.Y.Z
    #      skipped — its log read `32 passed, 2 skipped` while reporting green (#34).
    #   2. The no-skip guard below. Fetching tags fixes today's symptom; asserting that
    #      nothing skipped is what stops the silent-skip failure mode returning through
    #      some other change, which is the actual defect in #34.
    #
    # test_cargo_toml and test_go_module are absent deliberately: there is no Cargo.toml or
    # go.mod here for them to judge, and a check with no subject skips, which reads as a
    # pass — the same #34 failure mode, one level up.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-tags` alone is not enough on a shallow clone — the tagged commits have
          # to be present for `git rev-parse <tag>^{commit}` and `git branch --contains`
          # to answer, and test_release_tags skips on both.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # RHIZA_DOCTEST_FOLDERS is left unset on purpose — this project's Python *is* under
      # `src`, which is the variable's own fallback, so setting it would add a second place
      # to keep the folder name correct.
      #
      # `-rs` prints skip reasons, which is what the guard reads. With tags present these
      # five modules are 34 passed / 0 skipped, so "no skips" is a bar this repo actually
      # meets rather than an aspiration.
      - name: Run this package's checks against this repository
        run: |
          set -o pipefail
          uv run --group test pytest -ra -rs --pyargs \
            pytest_rhiza.checks.test_readme \
            pytest_rhiza.checks.test_readme_validation \
            pytest_rhiza.checks.test_pyproject \
            pytest_rhiza.checks.test_docstrings \
            pytest_rhiza.checks.test_release_tags | tee checks.log
          if grep -q "skipped" checks.log; then
            echo "::error::A self-applied check skipped. A skipped assertion reads as a pass, which is the defect this guard exists to prevent (#34)."
            exit 1
          fi

  # One required check for branch protection, rather than a list that has to be edited
  # every time a job is added or renamed. `always()` plus an explicit result scan is the
  # form that actually fails on a skipped or cancelled dependency; a bare `needs:` would
  # let a skipped job pass as success.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - test
      - typecheck
      - docs-coverage
      - deptry
      - security
      - audit
      - lowest-deps
      - license
      - rhiza-test

    steps:
      - name: Assert every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required gate did not succeed (saw '$result')."
              exit 1
            fi
          done
          echo "All gates succeeded."
